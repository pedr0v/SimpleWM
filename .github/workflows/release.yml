name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Import Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build, sign, notarize
        run: |
          set -euo pipefail
          export SIMPLEWM_VERSION="${GITHUB_REF_NAME#v}"
          export SIMPLEWM_NOTARIZE=1
          scripts/make-app.sh

      # Sparkle reads releases/latest/download/appcast.xml. The appcast lists
      # this release only. Its EdDSA signature uses the SPARKLE_PRIVATE_KEY
      # secret. The key goes to generate_appcast on stdin, never to a file.
      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SPARKLE_PRIVATE_KEY" ] || { echo "Set the SPARKLE_PRIVATE_KEY secret." >&2; exit 1; }
          VERSION="${GITHUB_REF_NAME#v}"
          # make-app.sh resolved the Sparkle package, so its tools are in .build/artifacts.
          GENERATE_APPCAST="$(find .build/artifacts -type f -path '*/bin/generate_appcast' | head -1)"
          [ -x "$GENERATE_APPCAST" ] || { echo "generate_appcast not found." >&2; exit 1; }
          ARCHIVES="$RUNNER_TEMP/appcast"
          rm -rf "$ARCHIVES"
          mkdir -p "$ARCHIVES"
          cp "dist/SimpleWM-$VERSION.zip" "$ARCHIVES/"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$GENERATE_APPCAST" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/pedr0v/SimpleWM/releases/download/$GITHUB_REF_NAME/" \
            --full-release-notes-url "https://github.com/pedr0v/SimpleWM/releases/tag/$GITHUB_REF_NAME" \
            --link "https://github.com/pedr0v/SimpleWM" \
            --maximum-deltas 0 \
            -o "$GITHUB_WORKSPACE/dist/appcast.xml" \
            "$ARCHIVES"
          grep -q "sparkle:edSignature" dist/appcast.xml || { echo "The appcast has no EdDSA signature." >&2; exit 1; }
          cat dist/appcast.xml

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "dist/SimpleWM-$VERSION.zip" dist/appcast.xml \
            --title "SimpleWM $VERSION" --generate-notes
